name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install timm==1.0.24 transformers==5.16.1 huggingface_hub==1.18.0
      - name: Lint + types
        run: |
          ruff check src scripts tests
          pip install mypy==1.18.2 types-PyYAML
          mypy
      - name: Committed split and audit are reproducible
        run: |
          python scripts/00_prepare_data.py
          git diff --exit-code artifacts/data artifacts/splits
      - name: Tests (synthetic features, no GPU, no gated weights)
        run: pytest -o addopts="" -q
      - name: End-to-end smoke (stages 2-4 via CLI)
        run: python scripts/smoke_e2e.py
